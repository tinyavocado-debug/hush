<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#020106">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Orbit">
  <meta name="description" content="A quiet patch of deep space for breath-led rest.">
  <title>Orbit · Hush</title>
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="icon" href="../icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../shared/base.css">
  <link rel="stylesheet" href="orbit.css">
</head>
<body>
  <canvas id="scene" aria-hidden="true"></canvas>
  <div class="dusk" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>

  <main id="app" data-state="setup">

    <!-- ───────────── Setup ───────────── -->
    <section class="screen setup" aria-labelledby="setupTitle">
      <header class="intro">
        <p class="eyebrow">Orbit</p>
        <h1 id="setupTitle">How long would you like to rest?</h1>
      </header>

      <div class="dial-wrap">
        <div class="dial" id="dial" role="slider" tabindex="0"
             aria-label="Session length" aria-valuemin="5" aria-valuemax="180"
             aria-valuenow="30" aria-valuetext="30 minutes">
          <svg viewBox="0 0 300 300" aria-hidden="true">
            <defs>
              <radialGradient id="pebble" cx="38%" cy="30%" r="80%">
                <!-- A stone grey (#a49e93), shaded with its light/mid/dark mix -->
                <stop offset="0" stop-color="#c1bdb6"/>
                <stop offset=".55" stop-color="#a49e93"/>
                <stop offset="1" stop-color="#6b6760"/>
              </radialGradient>
              <radialGradient id="halo">
                <stop offset="0" stop-color="#f2c58a" stop-opacity=".5"/>
                <stop offset="1" stop-color="#f2c58a" stop-opacity="0"/>
              </radialGradient>
              <filter id="stoneShadow" x="-50%" y="-50%" width="200%" height="200%">
                <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity=".45"/>
              </filter>
            </defs>
            <circle class="track" cx="150" cy="150" r="118"/>
            <g id="dialLaps"></g>
            <g id="dialTicks"></g>
            <circle class="arc" id="dialArc" cx="150" cy="150" r="118" transform="rotate(-90 150 150)"/>
            <g id="dialKnob">
              <circle r="36" fill="url(#halo)"/>
              <ellipse rx="17" ry="14.5" fill="url(#pebble)" filter="url(#stoneShadow)"/>
              <ellipse cx="-5" cy="-6" rx="6.5" ry="3.2" fill="#fff" opacity=".35" transform="rotate(-22)"/>
            </g>
          </svg>
          <div class="readout">
            <span class="num" id="setNum">30</span>
            <span class="unit" id="setUnit">minutes</span>
          </div>
          <button class="pebble-btn minus" id="minus" type="button" aria-label="Five minutes less">&minus;</button>
          <button class="pebble-btn plus" id="plus" type="button" aria-label="Five minutes more">+</button>
        </div>
        <p class="dial-hint">Turn the stone &middot; five minute steps</p>
      </div>

      <div class="options">
        <div class="sounds" role="radiogroup" aria-label="Ambience">
          <button type="button" role="radio" data-sound="ocean">Float</button>
          <button type="button" role="radio" data-sound="rain">Voyage</button>
          <button type="button" role="radio" data-sound="silence">Silence</button>
        </div>
        <button class="begin" id="begin" type="button">Begin</button>
      </div>
    </section>

    <!-- ───────────── Session ───────────── -->
    <section class="screen session" aria-label="Session in progress">
      <p class="hint">Tap anywhere for controls</p>

      <div class="orb-wrap">
        <div class="orb" id="orb"></div>
        <div class="orb-grain" aria-hidden="true"></div>
        <svg class="ring" viewBox="0 0 100 100" aria-hidden="true">
          <circle class="ring-track" cx="50" cy="50" r="48"/>
          <circle class="ring-fill" id="ringFill" cx="50" cy="50" r="48" transform="rotate(-90 50 50)"/>
        </svg>
        <div class="time" id="time" role="timer">30:00</div>
      </div>

      <p class="breath" id="breath" aria-hidden="true">breathe in</p>

      <div class="controls">
        <button class="ctrl" id="soundBtn" type="button" aria-pressed="true" aria-label="Ambience on">
          <svg class="i-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12c2-3 4-3 6 0s4 3 6 0 4-3 6 0"/><path d="M3 17c2-3 4-3 6 0s4 3 6 0 4-3 6 0" opacity=".5"/></svg>
          <svg class="i-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 14h18" opacity=".6"/><path d="M5 5l14 14"/></svg>
          <span>Sound</span>
        </button>
        <button class="ctrl primary" id="pauseBtn" type="button" aria-label="Pause">
          <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6v12M15 6v12"/></svg>
          <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"/></svg>
          <span id="pauseLabel">Pause</span>
        </button>
        <button class="ctrl" id="endBtn" type="button" aria-label="End session">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7"/><path d="M12 9v6M9 12h6" transform="rotate(45 12 12)"/></svg>
          <span>End</span>
        </button>
      </div>
    </section>

    <!-- ───────────── Complete ───────────── -->
    <section class="screen complete" aria-labelledby="doneTitle">
      <svg class="glyph" viewBox="0 0 80 80" aria-hidden="true">
        <circle cx="40" cy="40" r="6"/>
        <circle cx="40" cy="40" r="16" opacity=".6"/>
        <circle cx="40" cy="40" r="27" opacity=".35"/>
        <circle cx="40" cy="40" r="38" opacity=".15"/>
      </svg>
      <p class="eyebrow">Session complete</p>
      <h2 id="doneTitle">Welcome back.</h2>
      <p class="rested" id="rested">You rested for 30 minutes.</p>
      <p class="aftercare" id="aftercare">Take a slow sip of water before you rise.</p>
      <button class="ghost" id="again" type="button">Rest again</button>
    </section>

  </main>

  <a class="back" href="../" aria-label="All designs">&larr;</a>
  <script src="../shared/analytics.js" defer></script>
  <script src="../shared/core.js" defer></script>
  <script src="orbit.js" defer></script>
</body>
</html>
