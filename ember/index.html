<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#140d0b">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Ember">
  <meta name="description" content="An incense-stick rest timer.">
  <title>Ember · Hush</title>
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="icon" href="../icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../shared/base.css">
  <link rel="stylesheet" href="ember.css">
</head>
<body>
  <canvas id="scene" aria-hidden="true"></canvas>
  <div class="vignette" aria-hidden="true"></div>

  <main id="app" data-state="setup">

    <section class="screen setup" aria-labelledby="setupTitle">
      <header class="intro">
        <p class="eyebrow">Ember</p>
        <h1 id="setupTitle">Choose the length of your incense.</h1>
      </header>

      <div class="stage" id="stage" role="slider" tabindex="0"
           aria-label="Session length" aria-valuemin="5" aria-valuemax="120"
           aria-valuenow="30" aria-valuetext="30 minutes">
        <div class="readout" id="readout">
          <span class="num" id="setNum">30</span>
          <span class="unit" id="setUnit">minutes</span>
        </div>
        <p class="stage-hint">Drag up or down</p>
        <button class="step minus" id="minus" type="button" aria-label="Five minutes less">&minus;</button>
        <button class="step plus" id="plus" type="button" aria-label="Five minutes more">+</button>
      </div>

      <div class="options">
        <div class="sounds" role="radiogroup" aria-label="Ambience">
          <button type="button" role="radio" data-sound="temple">Drone</button>
          <button type="button" role="radio" data-sound="hearth">Hearth</button>
          <button type="button" role="radio" data-sound="silence">Silence</button>
        </div>
        <button class="begin" id="begin" type="button">Light</button>
      </div>
    </section>

    <section class="screen session" aria-label="Session in progress">
      <p class="hint">Tap anywhere for controls</p>
      <div class="session-top">
        <div class="time" id="time" role="timer">30:00</div>
        <p class="breath" id="breath" aria-hidden="true">breathe in</p>
      </div>
      <div class="controls">
        <button class="ctrl" id="soundBtn" type="button" aria-pressed="true" aria-label="Ambience on">
          <svg class="i-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12c2-3 4-3 6 0s4 3 6 0 4-3 6 0"/><path d="M3 17c2-3 4-3 6 0s4 3 6 0 4-3 6 0" opacity=".5"/></svg>
          <svg class="i-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 14h18" opacity=".6"/><path d="M5 5l14 14"/></svg>
          <span>Sound</span>
        </button>
        <button class="ctrl primary" id="pauseBtn" type="button" aria-label="Pause">
          <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6v12M15 6v12"/></svg>
          <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"/></svg>
          <span id="pauseLabel">Pause</span>
        </button>
        <button class="ctrl" id="endBtn" type="button" aria-label="End session">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7"/><path d="M12 9v6M9 12h6" transform="rotate(45 12 12)"/></svg>
          <span>End</span>
        </button>
      </div>
    </section>

    <section class="screen complete" aria-labelledby="doneTitle">
      <svg class="glyph" viewBox="0 0 60 90" aria-hidden="true">
        <path d="M30 86 C30 70 22 64 26 52 C30 40 40 38 36 26 C33 17 24 14 28 4"/>
        <path d="M33 86 C34 74 40 68 37 58" opacity=".4"/>
      </svg>
      <p class="eyebrow">The incense is spent</p>
      <h2 id="doneTitle">Welcome back.</h2>
      <p class="rested" id="rested">You rested for 30 minutes.</p>
      <p class="aftercare" id="aftercare">Take a slow sip of water before you rise.</p>
      <button class="ghost" id="again" type="button">Light another</button>
    </section>

  </main>

  <a class="back" href="../" aria-label="All designs">&larr;</a>
  <script src="../shared/core.js" defer></script>
  <script src="ember.js" defer></script>
</body>
</html>
